name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          install-mode: goinstall

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  money-safety:
    name: Money Safety Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for TODO(money)
        run: |
          if grep -rn 'TODO(money)' --include='*.go' .; then
            echo "::error::TODO(money) found in Go source — must be resolved before merge"
            exit 1
          fi
      - name: Check for floats in money paths
        run: |
          if grep -rn 'float32\|float64' --include='*.go' . | grep -i 'price\|cost\|amount\|balance\|charge\|credit\|debit\|wallet\|invoice\|rate\b\|fee\|discount\|tax\|revenue\|money\|currency\|cent\|dollar\|total\b'; then
            echo "::error::Float type used in a money-related path — use shopspring/decimal"
            exit 1
          fi

  verify-manifests:
    name: Verify Generated Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate and diff
        run: |
          make manifests generate
          if [ -n "$(git diff --name-only)" ]; then
            echo "::error::Generated files are out of date. Run 'make manifests generate' and commit."
            git diff --stat
            exit 1
          fi

  ledger-test:
    name: Ledger Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run ledger integration tests
        run: make test-integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  image-build:
    name: Container Image Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build image
        run: |
          make docker-build CONTAINER_TOOL=docker IMG=platform-billing-operator:ci-${{ github.sha }}

  demo:
    name: M0 Demo (kind + Kuadrant)
    runs-on: ubuntu-latest
    needs: [lint, test]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          # kind
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          # operator-sdk
          OSDK_VERSION=$(grep 'OPERATOR_SDK_VERSION' Makefile | head -1 | awk -F'?= ' '{print $2}')
          curl -sSLo ./operator-sdk "https://github.com/operator-framework/operator-sdk/releases/download/${OSDK_VERSION}/operator-sdk_linux_amd64"
          chmod +x ./operator-sdk
          sudo mv ./operator-sdk /usr/local/bin/operator-sdk
          # helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Create kind cluster
        run: |
          kind create cluster --name platform-billing-dev --wait 60s
        env:
          KIND_EXPERIMENTAL_PROVIDER: docker
      - name: Install Kuadrant stack
        run: |
          KUBECTL=kubectl hack/setup-kuadrant.sh kind-platform-billing-dev
      - name: Install OLM
        run: |
          operator-sdk olm install --timeout 5m
      - name: Build and deploy operator via OLM
        run: |
          IMG=platform-billing-operator:ci-${{ github.sha }}
          BUNDLE_IMG=platform-billing-operator-bundle:ci-${{ github.sha }}

          # Build operator image and load into kind.
          make docker-build CONTAINER_TOOL=docker IMG=$IMG
          kind load docker-image $IMG --name platform-billing-dev

          # Generate and build bundle.
          make bundle IMG=$IMG CONTAINER_TOOL=docker
          make bundle-build BUNDLE_IMG=$BUNDLE_IMG CONTAINER_TOOL=docker
          kind load docker-image $BUNDLE_IMG --name platform-billing-dev

          # Deploy via OLM.
          operator-sdk run bundle $BUNDLE_IMG --timeout 5m
      - name: Run M0 demo
        run: |
          KUBECTL=kubectl CLUSTER_CONTEXT=kind-platform-billing-dev make demo-m0
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Operator logs ==="
          kubectl logs -l control-plane=controller-manager -n platform-billing-operator-system --tail=100 2>/dev/null || true
          echo "=== Events ==="
          kubectl get events -n billing-demo --sort-by='.lastTimestamp' 2>/dev/null || true
          echo "=== Kuadrant CRs ==="
          kubectl get tokenratelimitpolicies,ratelimitpolicies,authpolicies -A 2>/dev/null || true
      - name: Cleanup
        if: always()
        run: kind delete cluster --name platform-billing-dev

  demo-m1:
    name: M1 Demo (kind + Kuadrant + Postgres + Capture)
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install tools
        run: |
          # kind
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          # helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Build capture filter
        run: make capture-filter
      - name: Create kind cluster
        run: |
          kind create cluster --name platform-billing-dev --wait 60s
        env:
          KIND_EXPERIMENTAL_PROVIDER: docker
      - name: Install Kuadrant stack
        run: |
          KUBECTL=kubectl hack/setup-kuadrant.sh kind-platform-billing-dev
      - name: Deploy Postgres
        run: |
          KUBECTL=kubectl SKIP_MIGRATIONS=true hack/setup-postgres.sh kind-platform-billing-dev
      - name: Run M1 demo
        run: |
          KUBECTL=kubectl CLUSTER_CONTEXT=kind-platform-billing-dev CONTAINER_TOOL=docker KIND_EXPERIMENTAL_PROVIDER=docker make demo-m1
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Operator logs ==="
          kubectl logs -l control-plane=controller-manager -n platform-billing-operator-system --tail=100 2>/dev/null || true
          echo "=== Ledger-svc logs ==="
          kubectl logs -l app=ledger-svc -n billing-demo --tail=100 2>/dev/null || true
          echo "=== Events (billing-demo) ==="
          kubectl get events -n billing-demo --sort-by='.lastTimestamp' 2>/dev/null || true
          echo "=== Events (billing-system) ==="
          kubectl get events -n billing-system --sort-by='.lastTimestamp' 2>/dev/null || true
          echo "=== Kuadrant CRs ==="
          kubectl get tokenratelimitpolicies,ratelimitpolicies,authpolicies,wasmplugins -A 2>/dev/null || true
          echo "=== Postgres tables ==="
          kubectl exec -n billing-system deploy/postgres -- psql -U billing -d billing_ledger -c '\dt' 2>/dev/null || true
          echo "=== usage_events ==="
          kubectl exec -n billing-system deploy/postgres -- psql -U billing -d billing_ledger -c 'SELECT * FROM usage_events ORDER BY ingested_at;' 2>/dev/null || true
      - name: Cleanup
        if: always()
        run: kind delete cluster --name platform-billing-dev

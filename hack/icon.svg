<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 40">
  <!-- Background rounded rectangle -->
  <rect x="1" y="1" width="78" height="38" rx="6" ry="6" fill="#0066CC" opacity="0.12"/>
  <rect x="1" y="1" width="78" height="38" rx="6" ry="6" fill="none" stroke="#0066CC" stroke-width="1.5"/>

  <!-- Meter gauge arc (left side) -->
  <path d="M 14 28 A 12 12 0 0 1 38 28" fill="none" stroke="#0066CC" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gauge tick marks -->
  <line x1="16" y1="22" x2="18" y2="24" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="17" x2="23" y2="19.5" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="17" x2="29" y2="19.5" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="22" x2="34" y2="24" stroke="#0066CC" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Gauge needle -->
  <line x1="26" y1="27" x2="32" y2="19" stroke="#00AAFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="27" r="2" fill="#00AAFF"/>

  <!-- Connecting data-flow dots -->
  <circle cx="43" cy="20" r="1.5" fill="#0066CC"/>
  <circle cx="48" cy="20" r="1" fill="#0066CC" opacity="0.6"/>
  <circle cx="52" cy="20" r="1.5" fill="#0066CC"/>

  <!-- Currency symbol (right side) - cleaner $ sign -->
  <!-- Top curve of S -->
  <path d="M 66 14 C 66 14, 62 11, 58 14 C 55 16, 58 19, 62 20"
        fill="none" stroke="#0066CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom curve of S -->
  <path d="M 62 20 C 66 21, 69 24, 66 27 C 63 29, 58 27, 58 27"
        fill="none" stroke="#0066CC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vertical bar through $ -->
  <line x1="62" y1="9" x2="62" y2="31" stroke="#00AAFF" stroke-width="1.8" stroke-linecap="round"/>
</svg>

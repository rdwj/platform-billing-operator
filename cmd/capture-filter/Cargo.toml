[package]
name = "capture-filter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = { git = "https://github.com/Kuadrant/proxy-wasm-rust-sdk.git", rev = "6ceedbb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-svc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-svc-billing-reader
rules:
  - apiGroups: ["billing.opendatahub.io"]
    resources: ["pricebooks", "plans", "tenantaccounts", "budgetpolicies", "billingconnectors"]
    verbs: ["get", "list"]
  - apiGroups: ["billing.opendatahub.io"]
    resources: ["reservations"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["billing.opendatahub.io"]
    resources: ["reservations/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-svc-billing-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ledger-svc-billing-reader
subjects:
  - kind: ServiceAccount
    name: ledger-svc

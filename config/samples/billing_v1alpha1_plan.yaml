# Sample Plan demonstrating all compilation paths.
#
# Token limits → TokenRateLimitPolicy (tokensPerMinute, tokensPerDay)
# Request limits → RateLimitPolicy (requestsPerMinute)
# Model scopes → AuthPolicy CEL predicates
# maxConcurrency → stored but not enforceable (sets UnsupportedField condition)
#
# For the demo cluster, the gateway name is "billing-demo-gateway" in namespace
# "billing-demo". Replace the targetRef for production deployments.
apiVersion: billing.opendatahub.io/v1alpha1
kind: Plan
metadata:
  name: priority
spec:
  limits:
    requestsPerMinute: 600
    tokensPerMinute: 2000000
    tokensPerDay: 400000000
    maxConcurrency: 64
  modelScopes: ["llama-3-*", "granite-*"]
  geoScopes: ["*"]
  queueClass: priority
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: billing-demo-gateway  # demo cluster; production: data-science-gateway
  priceBookRef: pb-standard

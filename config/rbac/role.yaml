---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - nodes
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - billing.opendatahub.io
  resources:
  - billingconnectors
  - budgetpolicies
  - plans
  - tenantaccounts
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - billing.opendatahub.io
  resources:
  - billingconnectors/status
  - budgetpolicies/status
  - plans/status
  - tenantaccounts/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - billing.opendatahub.io
  resources:
  - budgetpolicies/finalizers
  - plans/finalizers
  - tenantaccounts/finalizers
  verbs:
  - update
- apiGroups:
  - billing.opendatahub.io
  resources:
  - pricebooks

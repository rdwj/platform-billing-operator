---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - billing.opendatahub.io
  resources:
  - plans
  - tenantaccounts
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - billing.opendatahub.io
  resources:
  - plans/finalizers
  - tenantaccounts/finalizers
  verbs:
  - update
- apiGroups:
  - billing.opendatahub.io
  resources:
  - plans/status
  - tenantaccounts/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kuadrant.io
  resources:
  - authpolicies
  - ratelimitpolicies
  - tokenratelimitpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fake-openai
  namespace: billing-demo
spec:
  parentRefs:
    - name: billing-demo-gateway
      namespace: billing-demo
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - name: fake-openai
          port: 8080

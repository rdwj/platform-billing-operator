apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmeter-redis
  namespace: billing-system
  labels:
    app: openmeter-redis
    app.kubernetes.io/part-of: openmeter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmeter-redis
  template:
    metadata:
      labels:
        app: openmeter-redis
        app.kubernetes.io/part-of: openmeter
    spec:
      serviceAccountName: openmeter
      containers:
        - name: redis
          image: redis:7.4.7
          command:
            - redis-server
            - --maxmemory
            - 50mb
            - --maxmemory-policy
            - noeviction
            - --maxmemory-samples
            - "10"
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openmeter-redis
  namespace: billing-system
  labels:
    app: openmeter-redis
    app.kubernetes.io/part-of: openmeter
spec:
  selector:
    app: openmeter-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis

apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmeter-kafka
  namespace: billing-system
  labels:
    app: openmeter-kafka
    app.kubernetes.io/part-of: openmeter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openmeter-kafka
  template:
    metadata:
      labels:
        app: openmeter-kafka
        app.kubernetes.io/part-of: openmeter
    spec:
      serviceAccountName: openmeter
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.0.3
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9093
              name: controller
          env:
            - name: CLUSTER_ID
              value: "ca497efe-9f82-4b84-890b-d9969a9a2e1c"
            - name: KAFKA_BROKER_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://openmeter-kafka:9092"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_MESSAGE_TIMESTAMP_AFTER_MAX_MS
              value: "9223372036854775807"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openmeter-kafka
  namespace: billing-system
  labels:
    app: openmeter-kafka
    app.kubernetes.io/part-of: openmeter
spec:
  selector:
    app: openmeter-kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: broker
    - port: 9093
      targetPort: 9093
      name: controller

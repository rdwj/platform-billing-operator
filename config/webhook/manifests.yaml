---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-billing-opendatahub-io-v1alpha1-pricebook
  failurePolicy: Fail
  name: vpricebook-v1alpha1.kb.io
  rules:
  - apiGroups:
    - billing.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pricebooks
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-billing-opendatahub-io-v1alpha1-reservation
  failurePolicy: Fail
  name: vreservation-v1alpha1.kb.io
  rules:
  - apiGroups:
    - billing.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - reservations
  sideEffects: None
